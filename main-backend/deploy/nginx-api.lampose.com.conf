# nginx reverse proxy for the Lampose main backend.
#
# One upstream serves all three frontends:
#   lampose.com          → /api/v2/listings
#   leads.lampose.com    → /api/v2/{auth,users,scraper,properties}
#   onboard.lampose.com  → /api/v1/{properties,permissions,…} + /api/v2/auth
#
# Port 5001 is what main-backend/.env sets. Change both together.
#
#   sudo cp deploy/nginx-api.lampose.com.conf /etc/nginx/sites-available/api.lampose.com
#   sudo ln -s /etc/nginx/sites-available/api.lampose.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.lampose.com     # fills in the TLS block below
#
# ── The one thing not to do here ──────────────────────────────────────────
# Do NOT add `add_header Access-Control-Allow-Origin ...` in this file. The
# application already sets it, per-origin, with credentials. nginx adding a
# second one makes the response carry two Access-Control-Allow-Origin headers,
# and every browser rejects that outright — the symptom is a CORS error that
# looks exactly like the backend forgot to set the header, which sends you
# debugging the wrong file. Leave CORS to the app.

server {
    listen 80;
    listen [::]:80;
    server_name api.lampose.com;

    # certbot replaces this with a redirect to 443 once the certificate exists.
    location / {
        proxy_pass http://127.0.0.1:5001;
        include /etc/nginx/proxy_params;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.lampose.com;

    # certbot fills these in.
    # ssl_certificate     /etc/letsencrypt/live/api.lampose.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.lampose.com/privkey.pem;

    # The app caps bodies at BODY_LIMIT, which is 25mb here because the
    # onboarding app posts base64-encoded photos in the JSON body. nginx's own
    # default is 1m, so without this every image upload would be rejected by
    # nginx first — with an HTML error page instead of the app's JSON.
    client_max_body_size 30m;

    # A CSV export of tens of thousands of leads streams for a while, and the
    # default 60s read timeout would cut it off mid-download.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    access_log /var/log/nginx/lampose-api.access.log;
    error_log  /var/log/nginx/lampose-api.error.log;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # The app runs with trust proxy on and reads this to know it is behind
        # TLS. Without it, req.protocol is always http.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Preflights and JSON are small; buffering them is fine and keeps the
        # upstream connection free.
        proxy_buffering on;
    }

    # Uptime checks belong here, not on /api/health — that one answers 503
    # when MongoDB is unreachable, which is correct for a human but would make
    # an automated restarter loop over a fault it cannot fix.
    location = /healthz {
        proxy_pass http://127.0.0.1:5001/api/health/live;
        access_log off;
    }
}
